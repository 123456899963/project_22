<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分享清单 · 茶·图鉴</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="share">

  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">茶</span><span>茶·图鉴</span>
      </a>
      <form class="search" data-search>
        <span aria-hidden="true" style="color:var(--ink-2)">⌕</span>
        <input type="search" placeholder="搜茶名或产地" aria-label="搜索茶品">
        <button class="clear" type="button" aria-label="清除">×</button>
        <div class="suggest"></div>
      </form>
      <div class="nav-actions">
        <a class="nav-link" href="favorites.html">我的收藏</a>
        <button class="btn btn-primary btn-sm" id="navAuth" type="button">登录</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="list-head">
      <div>
        <h1 id="shareTitle">我的收藏</h1>
        <p style="margin:4px 0 0;font-size:13px;color:var(--ink-2)" id="shareMeta"></p>
      </div>
    </div>

    <div class="card-grid" id="shareBox"></div>

    <div id="shareBar" style="position:sticky;bottom:16px;padding:16px 0">
      <button class="btn btn-primary" id="collectAll" type="button">一键收藏全部</button>
      <span id="shareHint" style="font-size:12px;color:var(--ink-2);margin-left:8px">登录后可一键收藏全部</span>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>茶·图鉴 · 只读分享页</span>
      <span>链接被撤销后将无法访问</span>
    </div>
  </footer>

  <nav class="mobile-tabs" aria-label="移动端导航">
    <a href="index.html">首页</a>
    <a href="list.html">茶类</a>
    <a href="favorites.html">收藏</a>
    <a href="profile.html">我的</a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
