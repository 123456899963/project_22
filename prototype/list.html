<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茶品列表 · 茶·图鉴</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list">

  <header class="nav">

      <a class="logo" href="index.html">
        <span class="logo-mark">茶</span><span>茶·图鉴</span>
      </a>
      <form class="search" data-search>

    <div class="filters" id="filters"></div>
    <div class="result-bar" id="resultBar"></div>
    <div class="card-grid" id="teaGrid"></div>

  <footer class="footer">

      <span>茶·图鉴 · 茶品鉴知识图鉴原型</span>
      <span>筛选为 AND 叠加，每页 12 款</span>

  <nav class="mobile-tabs" aria-label="移动端导航">
