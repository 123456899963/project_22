    patch:
      tags: [admin]
      summary: 更新配置（仅超管）
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: {type: string}
                      value: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: integer, format: int64}
    Page:
      in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    Size:
      in: query
      name: size
      schema: {type: integer, minimum: 1, maximum: 50, default: 12}

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    ProfileOk:
      description: 当前用户资料
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
    CategoriesOk:
      description: 茶类列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    TeaPageOk:
      description: 茶品分页
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeaPage'
    TeaDetailOk:
      description: 茶品详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeaDetail'
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 无权限或账号受限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 不存在或已下架
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: 文件超过 5MB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: 服务异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiEnvelope:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: OK}
        message: {type: string, example: success}
        traceId: {type: string}
        data: {}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: MM-AUTH-001}
        message: {type: string}
        traceId: {type: string}
        details:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    PageMeta:
      type: object
      properties:
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
        hasMore: {type: boolean}
    Profile:
      type: object
      properties:
        id: {type: integer, format: int64}
        nickname: {type: string}
        avatarUrl: {type: string}
        role: {type: string, enum: [user, admin, super]}
        status: {type: string, enum: [active, deleting, deleted]}
    Category:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        intro: {type: string}
        teaCount: {type: integer}
        subcategories:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              code: {type: string}
              name: {type: string}
              teaCount: {type: integer}
              contentStatus: {type: string, enum: [normal, constructing]}
    TeaSummary:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        alias: {type: string}
        categoryCode: {type: string}
        subcategoryCode: {type: string}
        grades:
          type: array
          items: {type: string}
        productionYear: {type: integer, nullable: true}
        yearBand: {type: string, enum: [新茶, 中期茶, 老茶], nullable: true}
        tags:
          type: array
          items: {type: string}
        thumbUrl: {type: string}
        lastUpdateAt: {type: string, format: date-time}
    TeaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TeaSummary'
    TeaDetail:
      allOf:
        - $ref: '#/components/schemas/TeaSummary'
        - type: object
          properties:
            aliases:
              type: array
              items: {type: string}
            extraSubcategories:
              type: array
              items: {type: string}
            origin:
              type: object
              properties:
                primary:
                  type: array
                  items: {type: string}
                secondary:
                  type: array
                  items: {type: string}
            quality:
              type: object
              properties:
                tags:
                  type: array
                  items: {type: string}
                description: {type: string}
            brewing:
              type: object
              properties:
                waterTempMin: {type: integer}
                waterTempMax: {type: integer}
                ratioGrams: {type: number}
                ratioWaterMl: {type: integer}
                vessel: {type: string}
                steepSecondsMin: {type: integer}
                steepSecondsMax: {type: integer}
                steepTimes: {type: integer}
            harvestPeriods:
              type: array
              items:
                type: object
                properties:
                  label: {type: string}
                  startMonth: {type: integer}
                  endMonth: {type: integer}
            standards:
              type: array
              items: {type: string}
            images:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer, format: int64}
                  type: {type: string}
                  seq: {type: integer}
                  url: {type: string}
                  thumbUrl: {type: string}
                  licenseLabel: {type: string}
            commentCount: {type: integer}
            publishedVersion: {type: integer}
    SubmissionInput:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [T1, T3, T4]}
        teaId: {type: integer, format: int64}
        title: {type: string, maxLength: 120}
        body: {type: string}
        anonymous: {type: boolean}
        images:
          type: array
          maxItems: 5
          items: {type: integer, format: int64}
        licenseGranted: {type: boolean}
        correctionFieldKey: {type: string}
        newValue: {type: string}
        reason: {type: string}
    ReviewInput:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, maxLength: 300}
        version: {type: integer}
    TeaInput:
      type: object
      properties:
        teaCode: {type: string}
        name: {type: string}
        aliases:
          type: array
          items: {type: string}
        categoryCode: {type: string}
        subcategoryCode: {type: string}
        extraSubcategoryCodes:
          type: array
          items: {type: string}
        originSummary: {type: string}
        regions:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string, enum: [primary, secondary]}
              flavorNote: {type: string}
        qualityTags:
          type: array
          items: {type: integer, format: int64}
        qualityDescription: {type: string}
        grades:
          type: array
          items: {type: string, enum: [特级, 一级, 二级]}
        waterTempMin: {type: integer}
        waterTempMax: {type: integer}
        ratioGrams: {type: number}
        ratioWaterMl: {type: integer}
        vessel: {type: string}
        steepSecondsMin: {type: integer}
        steepSecondsMax: {type: integer}
        steepTimes: {type: integer}
        productionYear: {type: integer, nullable: true}
        harvestPeriods:
          type: array
          items:
            type: object
            properties:
              startMonth: {type: integer}
              endMonth: {type: integer}
              seasonLabel: {type: string}
        standards:
          type: array
          items:
            type: object
            properties:
              standardNo: {type: string}
              standardType: {type: string}
