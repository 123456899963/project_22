openapi: 3.0.3
info:
  title: 茗脉 API
  version: 1.0.0
  description: |
    V1 前后端与小程序共用接口契约。所有路径前缀 /api/v1。
    成功响应统一为 {code, message, data, traceId}；分页数据为 {items, page, size, total, hasMore}。
servers:
  - url: /api/v1
    description: 生产/测试同域反向代理
tags:
  - name: auth
  - name: account
  - name: catalog
  - name: discovery
  - name: gallery
  - name: engagement
  - name: submission
  - name: governance
  - name: message
  - name: admin

paths:
  /auth/qrcode:
    post:
      tags: [auth]
      summary: 生成登录二维码
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/qrcode/{ticket}:
    get:
      tags: [auth]
      summary: 轮询扫码状态
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /auth/wechat/callback:
    post:
      tags: [auth]
      summary: 微信授权回调，签发令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: {type: string}
                state: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/ServerError'
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [auth]
      summary: 注销当前会话
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: 已注销
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/profile:
    get:
      tags: [account]
      summary: 当前用户资料
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/ProfileOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [account]
      summary: 修改昵称/头像
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: {type: string, minLength: 2, maxLength: 20}
                avatarUrl: {type: string, format: uri}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me/overview:
    get:
      tags: [account]
      summary: 个人中心计数聚合
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /me/deletion:
    post:
      tags: [account]
      summary: 申请注销（7 天冷静期）
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [account]
      summary: 撤销注销申请
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: 已撤销

  /home:
    get:
      tags: [catalog]
      summary: 首页聚合
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /categories:
    get:
      tags: [catalog]
      summary: 茶类与亚类
      responses:
        '200':
          $ref: '#/components/responses/CategoriesOk'
  /categories/{code}:
    get:
      tags: [catalog]
      summary: 单茶类详情
      parameters:
        - in: path
          name: code
          required: true
          schema: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/CategoriesOk'
        '404':
          $ref: '#/components/responses/NotFound'
  /teas:
    get:
      tags: [catalog]
      summary: 茶品列表（8 维筛选）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: category
          schema: {type: string}
        - in: query
          name: subcategory
          schema: {type: string}
        - in: query
          name: region
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - in: query
          name: ferment
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - in: query
          name: aroma
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - in: query
          name: season
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - in: query
          name: grade
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - in: query
          name: year
          style: form
          explode: true
          schema: {type: array, items: {type: integer}}
        - in: query
          name: sort
          schema:
            type: string
            enum: [updated_desc, name_pinyin, grade_desc]
            default: updated_desc
      responses:
        '200':
          $ref: '#/components/responses/TeaPageOk'
  /teas/compare:
    get:
      tags: [catalog]
      summary: 茶品对照数据（2～3 款）
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: array
            minItems: 2
            maxItems: 3
            items: {type: integer, format: int64}
          style: form
          explode: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /teas/{id}:
    get:
      tags: [catalog]
      summary: 茶品详情
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          $ref: '#/components/responses/TeaDetailOk'
        '404':
          $ref: '#/components/responses/NotFound'

  /search:
    get:
      tags: [discovery]
      summary: 关键词检索
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, maxLength: 50}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/TeaPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
  /identify/options:
    get:
      tags: [discovery]
      summary: 五维标签选项
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /identify/results:
    post:
      tags: [discovery]
      summary: 五维自查候选
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shape: {type: array, items: {type: string}}
                color: {type: array, items: {type: string}}
                soup: {type: array, items: {type: string}}
                ferment: {type: array, items: {type: string}}
                aroma: {type: array, items: {type: string}}
                page: {type: integer, default: 1}
                size: {type: integer, default: 12}
      responses:
        '200':
          $ref: '#/components/responses/TeaPageOk'

  /gallery:
    get:
      tags: [gallery]
      summary: 图鉴/用户实拍
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [official, user]
            default: official
        - in: query
          name: category
          schema: {type: string}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /pages/about:
    get:
      tags: [catalog]
      summary: 关于与协议
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /me/favorites:
    get:
      tags: [engagement]
      summary: 收藏列表
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: group
          schema:
            type: string
            enum: [want, drank]
            default: want
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/TeaPageOk'
    post:
      tags: [engagement]
      summary: 收藏茶品
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teaId]
              properties:
                teaId: {type: integer, format: int64}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/favorites/{teaId}:
    patch:
      tags: [engagement]
      summary: 移动收藏分组
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: teaId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group: {type: string, enum: [want, drank]}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [engagement]
      summary: 取消收藏
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: teaId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: 已取消

  /me/history:
    get:
      tags: [engagement]
      summary: 浏览历史
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [engagement]
      summary: 记录浏览
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teaId]
              properties:
                teaId: {type: integer, format: int64}
      responses:
        '204':
          description: 已记录
    delete:
      tags: [engagement]
      summary: 清空历史
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: 已清空

  /me/compare:
    get:
      tags: [engagement]
      summary: 对比篮
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [engagement]
      summary: 加入对比
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teaId]
              properties:
                teaId: {type: integer, format: int64}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [engagement]
      summary: 移除或清空对比
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: teaId
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: 已移除

  /teas/{teaId}/comments:
    get:
      tags: [engagement]
      summary: 茶品评论
      parameters:
        - in: path
          name: teaId
          required: true
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [engagement]
      summary: 发布评论（先审后发）
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: teaId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 200}
                imageId: {type: integer, format: int64}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/comments/{id}:
    delete:
      tags: [engagement]
      summary: 删除自己的评论
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: 已删除
        '403':
          $ref: '#/components/responses/Forbidden'
  /comments/{id}/like:
    post:
      tags: [engagement]
      summary: 点赞
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [engagement]
      summary: 取消点赞
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: 已取消

  /me/submissions:
    get:
      tags: [submission]
      summary: 我的投稿
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: type
          schema: {type: string, enum: [T1, T3, T4]}
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, pending, approved, rejected, locked, revised]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [submission]
      summary: 新建草稿
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me/submissions/{id}:
    get:
      tags: [submission]
      summary: 投稿详情
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [submission]
      summary: 修改草稿
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [submission]
      summary: 删除草稿
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 已删除
  /me/submissions/{id}/submit:
    post:
      tags: [submission]
      summary: 提交审核
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/submissions/{id}/resubmit:
    post:
      tags: [submission]
      summary: 驳回后重提
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/submissions/{id}/preview:
    get:
      tags: [submission]
      summary: 草稿/审核中预览
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /reports:
    post:
      tags: [governance]
      summary: 提交举报
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectType, objectId, reportType, description]
              properties:
                objectType: {type: string, enum: [image, comment, user_shot]}
                objectId: {type: integer, format: int64}
                teaId: {type: integer, format: int64}
                reportType: {type: string}
                description: {type: string, maxLength: 1000}
                evidence:
                  type: array
                  items: {type: string, description: 已上传图片 URL}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
  /reports/{id}/appeal:
    post:
      tags: [governance]
      summary: 申诉（每案 1 次）
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 1000}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/messages:
    get:
      tags: [message]
      summary: 消息列表
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: type
          schema: {type: string, enum: [review, correction, report, system]}
        - in: query
          name: unreadOnly
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /me/messages/{id}/read:
    patch:
      tags: [message]
      summary: 单条已读
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 已读
  /me/messages/read-all:
    patch:
      tags: [message]
      summary: 全部已读
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: 已读

  /admin/dashboard:
    get:
      tags: [admin]
      summary: 工作台概览
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/admins:
    get:
      tags: [admin]
      summary: 管理员白名单（仅超管）
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [admin]
      summary: 新增白名单（仅超管）
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid, role]
              properties:
                openid: {type: string, maxLength: 64}
                role: {type: string, enum: [admin, super]}
                note: {type: string, maxLength: 200}
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/admins/{id}:
    delete:
      tags: [admin]
      summary: 移除白名单（仅超管）
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 已移除
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/teas:
    get:
      tags: [admin]
      summary: 茶品管理列表
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: category
          schema: {type: string}
        - in: query
          name: keyword
          schema: {type: string}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [admin]
      summary: 新建茶品草稿
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeaInput'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /admin/teas/{id}:
    get:
      tags: [admin]
      summary: 茶品编辑详情
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/TeaDetailOk'
    patch:
      tags: [admin]
      summary: 保存草稿（乐观锁）
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeaInput'
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer}
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/teas/{id}/submit:
    post:
      tags: [admin]
      summary: 提交审核
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/teas/{id}/review:
    post:
      tags: [admin]
      summary: 审核通过/驳回
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/teas/{id}/unpublish:
    post:
      tags: [admin]
      summary: 下架
      security: [{bearerAuth: []}]
