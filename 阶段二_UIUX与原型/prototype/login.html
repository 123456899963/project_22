<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 茗脉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body id="page-root">
<div id="site-header"></div>

<main class="container">
  <section class="auth-card" id="auth-card">
    <span class="brand">茗脉</span>
    <p class="caption mt-2">六大茶类结构化知识库与图鉴</p>
    <h1 class="h2 mt-4">微信扫码登录</h1>
    <p class="caption mt-2" id="auth-desc">登录后可收藏、对比、评论、投稿与查看站内消息</p>

    <div class="qr-box" id="qr-box">
      <img id="qr-img" alt="微信登录二维码（原型示意）">
      <div class="qr-box__mask" id="qr-mask" hidden>
        <p>二维码已失效</p>
        <button class="btn btn-secondary btn-sm" id="qr-refresh" type="button">点击刷新</button>
      </div>
    </div>
    <p class="auth-note" id="qr-status">请使用微信扫一扫 · <span id="qr-timer">60</span> 秒后失效</p>

    <div class="auth-divider">原型演示</div>
    <label class="check-row auth-agree">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意<a class="btn-link" href="about.html#terms">《用户协议》</a>与<a class="btn-link" href="about.html#privacy">《隐私政策》</a></span>
    </label>
    <button class="btn btn-primary btn-block btn-lg mt-4" id="mock-login" type="button" disabled>模拟扫码成功并登录</button>
    <p class="auth-note mt-3">V1 仅支持微信授权登录，无密码体系，不提供密码找回。</p>

    <p class="mt-4"><a class="btn-link" id="back-link" href="index.html">返回继续浏览</a></p>
  </section>

  <section class="auth-card hidden" id="logged-card">
    <span class="brand">茗脉</span>
    <h1 class="h2 mt-4">你已登录</h1>
    <div class="logged-user mt-4">
      <span class="avatar avatar--lg" id="logged-avatar"></span>
      <strong id="logged-nick"></strong>
      <span class="caption" id="logged-since"></span>
    </div>
    <div class="auth-actions mt-5">
      <a class="btn btn-primary" id="continue-btn" href="index.html">继续浏览</a>
      <a class="btn btn-secondary" href="profile.html">进入个人中心</a>
      <button class="btn btn-ghost" id="logout-btn" type="button">退出登录</button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data/categories.js"></script>
<script src="assets/js/data/teas.js"></script>
<script src="assets/js/data/comments.js"></script>
<script src="assets/js/data/mock-user.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/pages/login.js"></script>
</body>
</html>
