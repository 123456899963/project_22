<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · 茗脉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body id="page-root">
<div id="site-header"></div>

<main>
  <section class="container">
    <nav class="crumbs" aria-label="面包屑">
      <a href="index.html">首页</a><span>/</span><span>个人中心</span>
    </nav>
  </section>

  <section class="container profile-head">
    <div class="profile-head__user">
      <span class="avatar avatar--xl" id="profile-avatar"></span>
      <div>
        <h1 class="h2" id="profile-nick"></h1>
        <p class="caption" id="profile-meta"></p>
      </div>
    </div>
    <div class="profile-head__actions">
      <a class="btn btn-secondary" href="settings.html">账号设置</a>
      <a class="btn btn-primary" href="submissions.html">我的投稿</a>
    </div>
  </section>

  <section class="container" id="status-banner"></section>

  <section class="container">
    <div class="stat-grid" id="stat-grid"></div>
  </section>

  <section class="container mt-5">
    <div class="quick-grid" id="quick-grid"></div>
  </section>

  <section class="container mt-5">
    <div class="panel">
      <div class="section-head">
        <h2 class="h3">最近收藏</h2>
        <a class="btn-link" href="favorites.html">查看全部</a>
      </div>
      <div class="grid-tea grid-tea--4 mt-3" id="profile-favs"></div>
      <div id="profile-favs-empty"></div>
    </div>
  </section>

  <section class="container mt-5">
    <div class="panel">
      <div class="section-head">
        <h2 class="h3">最近浏览</h2>
        <a class="btn-link" href="history.html">查看全部</a>
      </div>
      <div class="list mt-2" id="profile-history"></div>
    </div>
  </section>

  <section class="container mt-5">
    <div class="panel">
      <div class="section-head">
        <h2 class="h3">我的投稿</h2>
        <a class="btn-link" href="submissions.html">全部投稿</a>
      </div>
      <div class="list mt-2" id="profile-subs"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data/categories.js"></script>
<script src="assets/js/data/teas.js"></script>
<script src="assets/js/data/comments.js"></script>
<script src="assets/js/data/mock-user.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/pages/profile.js"></script>
</body>
</html>
