<body id="page-root">

<main>

    </nav>
  </section>

  <section class="container page-head">
    <div class="page-head__row">
      <div>
        <h1 class="h1">我的收藏</h1>
        <p class="page-head__desc">默认收藏到「想喝」，可移动到「已喝」。分组固定，不可新增或重命名，最多 500 条。</p>
      </div>
      <span class="caption" id="fav-total"></span>
    </div>
    <div class="tabs mt-4" id="fav-tabs">
      <button type="button" data-group="want" class="is-active">想喝 <span class="tab-count"></span></button>
      <button type="button" data-group="drunk">已喝 <span class="tab-count"></span></button>
      <button type="button" data-group="all">全部 <span class="tab-count"></span></button>
    </div>
  </section>

  <section class="container">
    <div class="list" id="fav-list"></div>
    <div id="fav-empty" class="hidden"></div>
  </section>
