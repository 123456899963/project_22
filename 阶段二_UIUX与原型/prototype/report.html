<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>举报 · 茗脉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body id="page-root">
<div id="site-header"></div>

<main class="container">
  <nav class="crumbs" aria-label="面包屑">
    <a href="index.html">首页</a><span>/</span><span>举报</span>
  </nav>

  <section class="page-head">
    <div class="page-head__row">
      <div>
        <h1 class="h1">提交举报</h1>
        <p class="page-head__desc">管理员将在 48 小时内完成首次响应。确认违规后将下架内容并通知作者；被处理方可申诉 1 次。</p>
      </div>
    </div>
  </section>

  <div class="submit-wrap">
    <div class="submit-card">
      <div class="banner banner--info mb-4">举报对象：<strong id="report-target">该内容</strong></div>
      <div class="form" id="report-form">
        <div id="report-errors"></div>
        <div class="field">
          <label class="field__label"><span class="req">*</span>举报类型</label>
          <div class="radio-row" id="report-types">
            <label><input type="radio" name="rtype" value="copyright" checked> 版权侵权</label>
            <label><input type="radio" name="rtype" value="illegal"> 违法违规</label>
            <label><input type="radio" name="rtype" value="false"> 内容不实</label>
            <label><input type="radio" name="rtype" value="ad"> 广告导流</label>
            <label><input type="radio" name="rtype" value="other"> 其他</label>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="report-desc"><span class="req">*</span>举报说明（至少 10 字）</label>
          <textarea class="textarea" id="report-desc" maxlength="200" placeholder="请说明具体问题、涉及位置，以及可核查的依据。"></textarea>
          <span class="counter" id="report-counter">0/200</span>
        </div>
        <div class="field">
          <label class="field__label">证据材料</label>
          <label class="upload-box" id="evidence-zone">
            <input type="file" id="evidence-input" accept="image/*" multiple hidden>
            <p><strong>上传截图或证明文件</strong>（可选，最多 3 张）</p>
            <p class="caption">原型阶段仅记录文件名，不上传服务器</p>
          </label>
          <div class="upload-preview" id="evidence-preview"></div>
        </div>
        <div class="check-row"><input type="checkbox" id="report-truth">
          <span>我确认举报内容真实，知悉恶意举报可能被限制使用举报功能。</span></div>
        <div class="chip-row">
          <button class="btn btn-secondary" type="button" id="report-cancel">取消</button>
          <button class="btn btn-primary btn-lg" type="button" id="report-submit">提交举报</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data/categories.js"></script>
<script src="assets/js/data/teas.js"></script>
<script src="assets/js/data/comments.js"></script>
<script src="assets/js/data/mock-user.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/pages/report.js"></script>
</body>
</html>
