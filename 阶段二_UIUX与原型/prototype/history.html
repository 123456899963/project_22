<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览历史 · 茗脉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body id="page-root">
<div id="site-header"></div>

<main>
  <section class="container">
    <nav class="crumbs" aria-label="面包屑">
      <a href="index.html">首页</a><span>/</span><a href="profile.html">个人中心</a><span>/</span><span>浏览历史</span>
    </nav>
  </section>

  <section class="container page-head">
    <div class="page-head__row">
      <div>
        <h1 class="h1">浏览历史</h1>
        <p class="page-head__desc">自动记录最近浏览的茶品，同一茶品只保留最新一条，最多 50 条。浏览记录不提供关闭开关。</p>
      </div>
      <button class="btn btn-secondary" id="clear-btn" type="button">一键清空</button>
    </div>
  </section>

  <section class="container">
    <p class="caption mb-3" id="history-count"></p>
    <div class="list" id="history-list"></div>
    <div id="history-empty" class="hidden"></div>
  </section>
</main>

<div class="modal-mask" id="clear-modal" hidden>
  <div class="modal">
    <h3>清空浏览历史？</h3>
    <p>清空后不可恢复。收藏与投稿不受影响。</p>
    <div class="modal__actions">
      <button class="btn btn-secondary" id="clear-cancel" type="button">取消</button>
      <button class="btn btn-danger" id="clear-confirm" type="button">确认清空</button>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data/categories.js"></script>
<script src="assets/js/data/teas.js"></script>
<script src="assets/js/data/comments.js"></script>
<script src="assets/js/data/mock-user.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/pages/history.js"></script>
</body>
</html>
