<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的投稿 · 茗脉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body id="page-root">
<div id="site-header"></div>

<main>
  <section class="container">
    <nav class="crumbs" aria-label="面包屑">
      <a href="index.html">首页</a><span>/</span><a href="profile.html">个人中心</a><span>/</span><span>我的投稿</span>
    </nav>
  </section>

  <section class="container page-head">
    <div class="page-head__row">
      <div>
        <h1 class="h1">我的投稿</h1>
        <p class="page-head__desc">投稿提交后进入「待审核」，工作日 24 小时内完成审核；驳回必须附理由，最多可修改重提 2 次。</p>
      </div>
      <div class="chip-row">
        <a class="btn btn-secondary" href="submit-fix.html?type=t3">补图 / 纠错</a>
        <a class="btn btn-primary" href="submit.html?type=t1">写品鉴长文</a>
      </div>
    </div>
    <div class="tabs mt-4" id="sub-tabs">
      <button type="button" data-status="all" class="is-active">全部 <span class="tab-count"></span></button>
      <button type="button" data-status="pending">待审核 <span class="tab-count"></span></button>
      <button type="button" data-status="approved">已通过 <span class="tab-count"></span></button>
      <button type="button" data-status="rejected">已驳回 <span class="tab-count"></span></button>
      <button type="button" data-status="locked">已锁定 <span class="tab-count"></span></button>
    </div>
  </section>

  <section class="container">
    <div class="list" id="sub-list"></div>
    <div id="sub-empty" class="hidden"></div>
    <div class="banner banner--info mt-4">每天最多投稿 3 条；系统按「茶名 + 茶类 + 亚类」查重，重复内容会提示改用纠错或补图。</div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/pages/submissions.js"></script>
</body>
</html>
